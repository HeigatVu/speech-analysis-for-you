[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "speech-analysis-for-you"
version = "0.2.0"
description = "Research/descriptive Vietnamese speech feature library with a CLAN-compatible CHAT subset, label-free extraction, and an adult-neuro feature catalog."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
]

[project.scripts]
say-features = "speech_features.cli:main"

[project.optional-dependencies]
legacy-ad = [
    "scikit-learn>=1.3",
]
legacy-preprocessing = [
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "pydub>=0.25",
    "matplotlib>=3.8",
    "tqdm>=4.67",
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["*.ipynb"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["speech_features*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
