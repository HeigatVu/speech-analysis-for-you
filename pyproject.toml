[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "speech-analysis-for-you"
version = "0.2.0"
description = "Research/descriptive Vietnamese speech feature library with a CLAN-compatible CHAT subset, label-free extraction, and an adult-neuro feature catalog."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["numpy>=1.26", "pandas>=2.1", "scipy>=1.11"]

[project.scripts]
say-features = "speech_features.cli:main"

[project.optional-dependencies]
legacy-ad = ["scikit-learn>=1.3"]
standardized-acoustic = ["opensmile>=2.5,<3"]
dev = ["pytest>=8.0.0", "ruff>=0.1.0"]
transcribe = [
    "torch>=2.0",
    "transformers>=4.36",
    "accelerate",
]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["*.ipynb"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["speech_features*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
